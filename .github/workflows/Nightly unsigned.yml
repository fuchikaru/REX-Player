name: Nightly Unsigned Release APK

on:
  workflow_dispatch:

concurrency:
  group: nightly-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # The build reads the git commit count/sha, so it needs the full history.
          fetch-depth: 0

      - name: Generate short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: 17
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # No signing properties are passed, so the release variant produces *-release-unsigned.apk
      - name: Build unsigned release APKs
        run: ./gradlew assembleRelease

      - name: List build output
        run: ls -lah app/build/outputs/apk/release/

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: REX-Player-arm64-v8a-release-unsigned-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk
          retention-days: 14

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: REX-Player-universal-release-unsigned-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/release/app-universal-release-unsigned.apk
          retention-days: 14
          
