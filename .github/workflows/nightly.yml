name: Nightly Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # The build reads the git commit count/sha, so it needs the full history.
          fetch-depth: 0

      - name: Generate short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: 17
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APKs
        run: ./gradlew assembleDebug

      - name: List build output
        run: ls -lah app/build/outputs/apk/debug/

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: REX-Player-arm64-v8a-debug-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          retention-days: 14

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: REX-Player-universal-debug-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/debug/app-universal-debug.apk
          retention-days: 14
